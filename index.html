<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة تتبع الدومينو — نسخة موبايل</title>
  <style>
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #f4f5f7;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden; /* لا سكرول */
    }

    h1 {
      margin: 4px 0;
      font-size: 1rem;
    }

    /* الشبكة */
    .grid {
      display: flex;
      gap: 2px;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: nowrap;
      padding: 2px;
      flex: 1; /* ياخد المساحة المتاحة */
      max-height: 55%;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
    }

    /* البلاطة */
    .tile {
      width: clamp(30px, 9vw, 40px);
      aspect-ratio: 1 / 1.6;
      background: linear-gradient(160deg,#fff 0%,#e2e8f0 100%);
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 2px;
      font-weight: 600;
      font-size: 0.7rem;
    }

    .tile:active { transform: scale(.95); }

    .marker {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 0.8rem;
      line-height: 1;
    }

    .divider {
      width: 70%;
      height: 1px;
      background: #555;
    }

    .num {
      height: 45%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* الجداول */
    .tables {
      width: 100%;
      max-height: 40%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px;
    }

    .box {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px;
      margin: 2px 0;
      font-size: 0.65rem;
      flex: 1;
      overflow: auto;
    }

    .box h2 {
      margin: 2px 0;
      font-size: 0.75rem;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.65rem;
    }

    td {
      padding: 2px;
      text-align: center;
    }

    tr:nth-child(even) td { background: #f8fafc; }

    /* زر إعادة الضبط */
    #resetBtn {
      margin-top: 2px;
      width: 100%;
      padding: 4px;
      font-size: 0.7rem;
      border: none;
      border-radius: 4px;
      background: #475569;
      color: #fff;
      cursor: pointer;
    }

    #resetBtn:hover { background: #334155; }
  </style>
</head>
<body>
  <h1>لوحة تتبع الدومينو</h1>
  <div id="dominoGrid" class="grid"></div>

  <div class="tables">
    <section class="box">
      <h2>الإحصاء (عدد البلاطات المتبقية لكل رقم)</h2>
      <table><tbody id="counterTable"></tbody></table>
    </section>

    <section class="box">
      <h2>الكروت المتبقية من كل باب</h2>
      <table><tbody id="remainingTable"></tbody></table>
      <button id="resetBtn">إعادة ضبط</button>
    </section>
  </div>

  <script>
    const grid = document.getElementById('dominoGrid');
    const counterTable = document.getElementById('counterTable');
    const remainingTable = document.getElementById('remainingTable');
    const resetBtn = document.getElementById('resetBtn');

    const savedStates = JSON.parse(localStorage.getItem('dominoStates') || '{}');

    function buildGrid() {
      grid.innerHTML = '';
      const max = 6;
      for (let col = 0; col <= max; col++) {
        const colDiv = document.createElement('div');
        colDiv.className = 'col';
        for (let r = col; r <= max-1; r++) {
          const tile = createTile(col, r);
          colDiv.appendChild(tile);
        }
        const baseTile = createTile(col, max);
        colDiv.appendChild(baseTile);
        grid.appendChild(colDiv);
      }
    }

    function createTile(a,b){
      const id = `${a}-${b}`;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.id = id;

      const marker = document.createElement('span');
      marker.className = 'marker';
      tile.appendChild(marker);

      const topEl = document.createElement('div');
      topEl.className = 'num';
      topEl.textContent = a;

      const divider = document.createElement('div');
      divider.className = 'divider';

      const bottomEl = document.createElement('div');
      bottomEl.className = 'num';
      bottomEl.textContent = b;

      tile.append(topEl, divider, bottomEl);

      const init = savedStates[id] || 'unknown';
      applyState(tile, init);

      tile.addEventListener('click', () => {
        const cur = tile.dataset.state || 'unknown';
        const next = (cur === 'hand') ? 'unknown' : 'hand';
        applyState(tile, next);
        saveStates();
        updateTables();
      });

      return tile;
    }

    function applyState(tile, state){
      tile.dataset.state = state;
      const mk = tile.querySelector('.marker');
      mk.textContent = (state === 'hand') ? '🛑' : '';
    }

    function saveStates(){
      const states = {};
      document.querySelectorAll('.tile').forEach(t => {
        states[t.dataset.id] = t.dataset.state || 'unknown';
      });
      localStorage.setItem('dominoStates', JSON.stringify(states));
    }

    function updateTables(){
      const counts = Array(7).fill(0);
      const remaining = Array.from({length:7}, () => []);
      document.querySelectorAll('.tile').forEach(t => {
        if((t.dataset.state || 'unknown') === 'unknown'){
          const [a,b] = t.dataset.id.split('-').map(Number);
          counts[a]++; if(a!==b) counts[b]++;
          remaining[a].push(`${a}|${b}`);
          if(a!==b) remaining[b].push(`${a}|${b}`);
        }
      });

      counterTable.innerHTML = counts.map((n,i) =>
        `<tr><td>الباب ${i}</td><td>${n}</td></tr>`
      ).join('');

      remainingTable.innerHTML = remaining.map((arr,i) =>
        `<tr><td>الباب ${i}</td><td>${arr.length?arr.join(' , '):'—'}</td></tr>`
      ).join('');
    }

    resetBtn.addEventListener('click', () => {
      if(!confirm('هل تريد إعادة الضبط؟')) return;
      document.querySelectorAll('.tile').forEach(t => applyState(t,'unknown'));
      saveStates();
      updateTables();
    });

    buildGrid();
    updateTables();
  </script>
</body>
</html>
