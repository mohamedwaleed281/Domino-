<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة تتبع الدومينو — نسخة موبايل</title>
  <style>
    :root {
      --clr-bg:#f4f5f7;
      --clr-card:#ffffff;
      --clr-card-edge:#e2e8f0;
      --clr-border:#cbd5e1;
      --clr-stop:#ef4444;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:"Cairo",sans-serif;
      background:var(--clr-bg);
      color:#0f172a;
      padding:0.5rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:0.6rem;
      height:100vh;
      overflow:hidden; /* عشان كل المحتوى يبان في شاشة واحدة */
    }
    h1{margin:0;text-align:center;font-size:clamp(0.9rem,2.5vw,1.1rem);}
    
    /* الشبكة */
    .grid{
      display:flex;
      gap:0.25rem;
      justify-content:center;
      align-items:flex-end;
      flex:1;
      max-height:60%;
    }
    .col{display:flex;flex-direction:column;gap:0.25rem;align-items:center;}
    
    /* البلاطة */
    .tile{
      width:clamp(28px,7vw,40px);
      aspect-ratio:1/1.6;
      background:linear-gradient(160deg,var(--clr-card) 0%,var(--clr-card-edge) 100%);
      border:1px solid var(--clr-border);
      border-radius:5px;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      user-select:none;
      cursor:pointer;
      padding:3px;
      font-weight:600;
      color:#0f172a;
    }
    .tile:active{transform:scale(.97);}
    .marker{position:absolute;top:2px;inset-inline-end:3px;font-size:0.8rem;}
    .divider{width:75%;height:1px;background:#6b7280;}
    .num{font-size:clamp(0.55rem,2vw,0.8rem);}
    
    /* الجداول */
    .tables{
      width:100%;
      max-height:38%;
      display:flex;
      flex-direction:column;
      gap:0.4rem;
      overflow:hidden;
    }
    .box{
      background:#fff;border:1px solid var(--clr-border);
      border-radius:6px;padding:0.3rem;
      box-shadow:0 1px 3px rgba(0,0,0,.04);
      flex:1;
      display:flex;flex-direction:column;
    }
    .box h2{margin:0 0 0.3rem;font-size:clamp(0.65rem,2vw,0.8rem);text-align:center;}
    table{width:100%;border-collapse:collapse;font-size:clamp(0.55rem,1.8vw,0.75rem);}
    td{padding:2px;text-align:center;}
    tr:nth-child(even) td{background:#f8fafc;}
    
    #resetBtn{
      margin-top:auto;
      padding:0.35rem;
      border:none;border-radius:5px;
      background:#475569;color:#fff;
      font-size:clamp(0.6rem,2vw,0.75rem);
      cursor:pointer;
    }
    #resetBtn:hover{background:#334155;}
  </style>
</head>
<body>
  <h1>لوحة تتبع الدومينو</h1>
  
  <!-- الشبكة -->
  <div id="dominoGrid" class="grid"></div>
  
  <!-- الجداول -->
  <div class="tables">
    <section class="box">
      <h2>الإحصاء (عدد البلاطات المتبقية لكل رقم)</h2>
      <table><tbody id="counterTable"></tbody></table>
    </section>
    <section class="box">
      <h2>الكروت المتبقية من كل باب</h2>
      <table><tbody id="remainingTable"></tbody></table>
      <button id="resetBtn">إعادة ضبط</button>
    </section>
  </div>
  
  <script>
    const grid = document.getElementById('dominoGrid');
    const counterTable = document.getElementById('counterTable');
    const remainingTable = document.getElementById('remainingTable');
    const resetBtn = document.getElementById('resetBtn');
    const savedStates = JSON.parse(localStorage.getItem('dominoStates') || '{}');

    function buildGrid(){
      grid.innerHTML = '';
      const max=6;
      for(let col=0;col<=max;col++){
        const colDiv=document.createElement('div');
        colDiv.className='col';
        for(let r=col;r<=max-1;r++){
          colDiv.appendChild(createTile(col,r));
        }
        colDiv.appendChild(createTile(col,max));
        grid.appendChild(colDiv);
      }
    }
    function createTile(a,b){
      const id=`${a}-${b}`;
      const tile=document.createElement('div');
      tile.className='tile';tile.dataset.id=id;
      const marker=document.createElement('span');marker.className='marker';tile.appendChild(marker);
      const top=document.createElement('div');top.className='num';top.textContent=a;
      const divider=document.createElement('div');divider.className='divider';
      const bottom=document.createElement('div');bottom.className='num';bottom.textContent=b;
      tile.append(top,divider,bottom);
      const init=savedStates[id]||'unknown';applyState(tile,init);
      tile.addEventListener('click',()=>{
        const cur=tile.dataset.state||'unknown';
        const next=(cur==='hand')?'unknown':'hand';
        applyState(tile,next);saveStates();updateTables();
      });
      return tile;
    }
    function applyState(tile,state){
      tile.dataset.state=state;
      const mk=tile.querySelector('.marker');
      mk.textContent=(state==='hand')?'🛑':'';
    }
    function saveStates(){
      const states={};
      document.querySelectorAll('.tile').forEach(t=>{
        states[t.dataset.id]=t.dataset.state||'unknown';
      });
      localStorage.setItem('dominoStates',JSON.stringify(states));
    }
    function updateTables(){
      const counts=Array(7).fill(0);
      const remaining=Array.from({length:7},()=>[]);
      document.querySelectorAll('.tile').forEach(t=>{
        if(t.dataset.state==='unknown'){
          const [a,b]=t.dataset.id.split('-').map(Number);
          counts[a]++;if(a!==b)counts[b]++;
          remaining[a].push(`${a}|${b}`);if(a!==b)remaining[b].push(`${a}|${b}`);
        }
      });
      counterTable.innerHTML=counts.map((n,i)=>
        `<tr><td>الباب ${i}</td><td>${n}</td></tr>`).join('');
      remainingTable.innerHTML=remaining.map((arr,i)=>
        `<tr><td>الباب ${i}</td><td>${arr.length?arr.join(' , '):'—'}</td></tr>`).join('');
    }
    resetBtn.addEventListener('click',()=>{
      if(!confirm('هل تريد إعادة الضبط؟'))return;
      document.querySelectorAll('.tile').forEach(t=>applyState(t,'unknown'));
      saveStates();updateTables();
    });
    buildGrid();updateTables();
  </script>
</body>
</html>
